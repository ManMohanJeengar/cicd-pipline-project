name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      # Compiles, then runs: unit tests (JUnit 5), API tests (MockMvc),
      # contract tests (Pact consumer + provider) and Testcontainers tests
      # (Docker is preinstalled on ubuntu-latest). Any failure stops the pipeline.
      - name: Build and test
        run: mvn -B clean verify

      - name: Upload test reports and pact contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/pacts
