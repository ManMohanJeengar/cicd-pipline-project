events {}

http {
  # Weighted split: 9 of every 10 requests -> stable, 1 of every 10 -> canary (10%)
  # To widen the rollout change the weights (e.g. 5/5 for 50%, 0/1 for 100%).
  upstream app {
    server stable:8080 weight=9;
    server canary:8080 weight=1;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
